name: Dependency checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Firebase SDK and rules checks
        run: npm exec --yes --package firebase-tools@15.34.2 -- firebase emulators:exec --config firebase.test.json --project demo-digitgit --only auth,firestore "npm run test:firebase"
